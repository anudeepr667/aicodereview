spring.datasource.url=jdbc:postgresql://localhost:5432/aicodereview
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
gemini.api.key=${GEMINI_API_KEY}
github.api.url=https://api.github.com
github.token=${GITHUB_TOKEN}
gemini.model=gemini-3.5-flash-lite

# Optional initial administrator bootstrap. Leave unset to disable provisioning.
app.admin.name=${APP_ADMIN_NAME:Administrator}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
